name: Tests
on: [push]
jobs:
  foundry:
    strategy:
      fail-fast: true
    name: Foundry suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Build
        env:
          FOUNDRY_PROFILE: ci_test
        run: |
          forge --version
          forge build
        id: build
      - name: Run Forge tests
        env:
          FOUNDRY_PROFILE: ci_test
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          forge test --fork-url "$MAINNET_RPC_URL" -vvv --fuzz-runs 1000
        id: forge-test

  contract_sizes:
    strategy:
      fail-fast: true
    name: Check contract size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Build and check sizes (normal)
        env:
          FOUNDRY_PROFILE: ci_sizes
        run: |
          forge --version
          forge build --sizes
        id: build_normal
